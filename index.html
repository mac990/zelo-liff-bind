<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZELO SPORT 通知綁定</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f5f5f5}
  .card{max-width:420px;margin:24px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#555;font-size:14px;line-height:1.6}
  .meta{font-size:12px;color:#888}
  input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin:8px 0 12px}
  button.primary{width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:10px;font-size:16px}
  button.primary:disabled{opacity:.5}
  #msg{font-size:14px;margin-top:10px;min-height:20px;word-break:break-all}
  #dbg{font-size:11px;color:#bbb;margin-top:8px;word-break:break-all}
  #formView{position:fixed;inset:0;background:#fff;display:none;flex-direction:column}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px;border-bottom:1px solid #eee}
  .topbar button{background:#111;color:#fff;border:0;border-radius:8px;padding:8px 12px}
  #formFrame{flex:1;width:100%;border:0}
</style>
</head>
<body>
<div id="bindCard" class="card">
  <h1>ZELO SPORT 通知綁定</h1>
  <p>請輸入您的手機號碼，完成後即可在 LINE 收到您的維修申請通知。請填寫與送修表單相同的手機號碼。</p>
  <div class="meta">LINE 帳號：<span id="name">讀取中…</span></div>
  <input id="phone" type="tel" inputmode="numeric" placeholder="請輸入手機號碼，例如 0912345678">
  <button id="bindBtn" class="primary" type="button">完成綁定</button>
  <div id="msg"></div>
  <div id="dbg">v2 · debug</div>
</div>

<div id="formView">
  <div class="topbar">
    <span id="formHint">✅ 綁定完成，請填寫送修表單</span>
    <button id="closeBtn" type="button">完成，關閉</button>
  </div>
  <iframe id="formFrame" title="送修表單"></iframe>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== 設定區 =====
const LIFF_ID     = '2007022255-PfOLsmAp';
const GAS_URL     = 'https://script.google.com/macros/s/AKfycbyi4Vr_Q7Wl_c-_AcxmcaoN12rzXEIVNLrrBpWC9ASIQQ9CAou5AIkdO4AQyKnc8ilRqw/exec';
const FORM_ID     = '1FAIpQLSdoxfnVi2zkaI7p7MOcuVVySrR1WztmBP-G5rO-3MbKrq7QJg';
const ENTRY_PHONE = 'entry.1237086045';
const ENTRY_NAME  = 'entry.1394252463';
const FORM_MODE   = 'redirect';

let profile = null;
const $ = id => document.getElementById(id);
const dbg = t => { $('dbg').textContent = 'v2 · debug · ' + t; };

function normalizePhone(v){
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('886')) d = '0' + d.slice(3);
  return d;
}

function buildFormUrl(phone){
  const p = new URLSearchParams({ usp: 'pp_url' });
  if (FORM_MODE === 'iframe') p.set('embedded', 'true');
  p.set(ENTRY_PHONE, phone);
  if (ENTRY_NAME && profile?.displayName) p.set(ENTRY_NAME, profile.displayName);
  return `https://docs.google.com/forms/d/e/${FORM_ID}/viewform?${p}`;
}

function showForm(phone, already = false){
  const url = buildFormUrl(phone);
  if (FORM_MODE === 'redirect') {
    $('msg').textContent = already ? '正在開啟送修表單…' : '綁定完成！正在開啟送修表單…';
    setTimeout(() => { window.location.href = url; }, 800);
    return;
  }
  $('formHint').textContent = already ? '📋 請填寫送修表單' : '✅ 綁定完成，請填寫送修表單';
  $('formFrame').src = url;
  $('bindCard').style.display = 'none';
  $('formView').style.display = 'flex';
}

$('closeBtn').onclick = () => liff.isInClient() ? liff.closeWindow() : window.close();

async function main(){
  await liff.init({ liffId: LIFF_ID });
  if (!liff.isLoggedIn()) { liff.login(); return; }
  profile = await liff.getProfile();
  $('name').textContent = profile.displayName;

  try {
    const r = await fetch(`${GAS_URL}?action=check&userId=${encodeURIComponent(profile.userId)}`, { method: 'GET', redirect: 'follow' });
    const raw = await r.text();
    let d = null;
    try { d = JSON.parse(raw); } catch (_) { dbg(`check 非JSON HTTP ${r.status}: ${raw.slice(0,100)}`); }
    if (d) {
      dbg(`check OK: ${raw.slice(0,80)}`);
      if (d.bound && d.phone) { showForm(d.phone, true); return; }
    }
  } catch (e) { dbg('check 失敗: ' + (e.message || e)); }

  $('bindBtn').onclick = bind;
}

async function bind(){
  const phone = normalizePhone($('phone').value);
  if (!/^09\d{8}$/.test(phone)) { $('msg').textContent = '請輸入正確的 10 碼手機號碼'; return; }
  $('bindBtn').disabled = true;
  $('msg').textContent = '綁定中…';
  try {
    const r = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      redirect: 'follow',
      body: JSON.stringify({ action: 'bind', userId: profile.userId, displayName: profile.displayName, phone })
    });
    const raw = await r.text();
    let d;
    try { d = JSON.parse(raw); }
    catch (_) {
      $('msg').textContent = `後端回應非 JSON（HTTP ${r.status}）：${raw.replace(/<[^>]+>/g,' ').slice(0,160)}`;
      $('bindBtn').disabled = false;
      return;
    }
    const ok = d.ok === true || d.success === true || d.status === 'ok' || d.status === 'already_bound';
    if (ok) {
      showForm(phone, d.status === 'already_bound');
    } else {
      $('msg').textContent = d.message || d.error || ('綁定失敗：' + raw.slice(0,160));
      $('bindBtn').disabled = false;
    }
  } catch (e) {
    $('msg').textContent = '連線失敗：' + (e && e.message ? e.message : e);
    $('bindBtn').disabled = false;
  }
}

main().catch(e => { $('msg').textContent = '初始化失敗：' + e.message; });
</script>
</body>
</html>
